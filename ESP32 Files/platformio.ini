; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Two tokens are supported from the same source (main.cpp selects the LED and serial
; setup per chip). build.bat builds both and bundles them for the app's one-click
; flasher. Both keep NVS at 0x9000 and the app at 0x10000; the flasher relies on
; that to update the firmware without touching the token's keys.

[platformio]
; The firmware sources (main.cpp, encryption.cpp/.h) sit directly in this folder
; rather than in a src/ subfolder, so point PlatformIO's source dir at the folder
; itself. This lets you build/flash straight from the repo's "ESP32 Files" folder.
src_dir = .
default_envs = esp32cam, esp32s3

[env]
platform = espressif32 @ 6.12.0
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_rts = 0
monitor_dtr = 0

[env:esp32cam]
board = esp32cam

; ESP32-S3-N16R8: 16 MB quad flash, 8 MB octal PSRAM. The native USB port runs the
; USB Serial/JTAG console (USB_MODE=1, CDC_ON_BOOT=1); the "COM" port is UART0.
; main.cpp answers on both.
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
